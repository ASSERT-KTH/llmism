# Curated seed list of LLM-sounding idioms.
# category: lexical | phrasal
# pattern: regex, applied case-insensitively
# suggestion: safe deterministic replacement; null = flag only, no auto-fix
#
# Pruned to rules that fired at least 10 times over ~15k assistant turns of
# Claude Code sessions (1.7M words). Rarer patterns (delve, tapestry, moreover,
# utilize, ...) cost scan time without earning hits; recover them from git
# history if a corpus needs them.
# Additional high-specificity patterns adapted from avoid-ai-writing's catalog.
# Context-dependent claims and artifacts are review-only, never rewritten blindly.
- id: genuine
  category: lexical
  pattern: '\bgenuine(?:ly)?\b'
  suggestion: null
- id: merely
  category: lexical
  pattern: '\bmerely\b'
  suggestion: null
- id: leverage-verb
  category: lexical
  pattern: '\bleverag(?:e|es|ed|ing)\b'
  suggestion: "use"
- id: underscores
  category: lexical
  pattern: '\bunderscore(?:s|d)?\b'
  suggestion: "shows"
- id: elevate
  category: lexical
  pattern: '\belevat(?:e|es|ed|ing)\b'
  suggestion: "improve"
- id: robust
  category: lexical
  pattern: '\brobust\b'
  suggestion: "solid"
- id: load-bearing
  category: lexical
  pattern: '\bload[- ]bearing\b'
  suggestion: "essential"
- id: boundaries
  category: lexical
  pattern: '\bboundaries\b'
  suggestion: "limits"
- id: honestly
  category: lexical
  pattern: '\bhonestly\b'
  suggestion: null
- id: sufficient
  category: lexical
  pattern: '\bsufficient\b'
  suggestion: "enough"
- id: terminate
  category: lexical
  pattern: '\bterminat(?:e|es|ed|ing)\b'
  suggestion: "end"
- id: approximately
  category: lexical
  pattern: '\bapproximately\b'
  suggestion: "about"
- id: in-addition
  category: phrasal
  pattern: '\bin addition\b'
  suggestion: "also"
- id: its-not-x-its-y
  category: phrasal
  pattern: "it'?s not [^,.;:!?]{1,60},? ?it'?s "
  suggestion: null
- id: rather-than
  category: phrasal
  pattern: '\brather than\b'
  suggestion: null
- id: ing-tail
  category: phrasal
  pattern: ',\s+(?:highlighting|reflecting|symbolizing|emphasizing|underscoring|showcasing|fostering|cultivating|signaling|demonstrating|illustrating|representing|suggesting|reinforcing|leveraging|aligning|embodying|exemplifying|epitomizing)\b'
  suggestion: null
- id: colon-reveal
  category: phrasal
  pattern: "(?:Here'?s the thing|Make no mistake|The truth is|Let'?s be honest|At the end of the day|The bottom line is|At its core|Fundamentally)\\b[,:]?"
  suggestion: null
- id: depth-signaling
  category: phrasal
  pattern: '\b(?:at a (?:more )?(?:fundamental|deeper|basic) level|on a deeper level|the real (?:issue|question|problem|point)(?: here)? (?:is|underneath)|what(?:'')?s really going on|beneath the surface|the deeper truth)\b'
  suggestion: null
- id: announcing-label
  category: phrasal
  pattern: "\\b(?:the key insight (?:here )?is|the important (?:thing|part)(?: here)? is|here'?s what matters|what'?s worth noting|the thing to (?:notice|understand|see) is|the point (?:here )?is this)\\b"
  suggestion: null
- id: engagement-bait
  category: phrasal
  pattern: "\\b(?:let me know if|hope (?:this|that) helps|would you like me to|what do you think\\?|feel free to (?:ask|reach out))"
  suggestion: null
- id: chatbot-opener
  category: phrasal
  pattern: '(?:\A|(?<=\n))(?:Certainly|Absolutely|Great question|You''re absolutely right)![ \t]*'
  suggestion: null
- id: vague-attribution
  category: phrasal
  pattern: '\b(?:experts (?:believe|say|agree)|studies (?:show|suggest|indicate)|research (?:shows|suggests))\b'
  suggestion: null
- id: generic-conclusion
  category: phrasal
  pattern: '\b(?:the future looks bright|only time will tell|in conclusion|to sum up)\b'
  suggestion: null
- id: significance-inflation
  category: phrasal
  pattern: '\b(?:watershed moment|marking a pivotal moment|paradigm shift|game[- ]changer)\b'
  suggestion: null
- id: in-order-to
  category: phrasal
  pattern: '\bin order to\b'
  suggestion: 'to'
- id: due-to-the-fact-that
  category: phrasal
  pattern: '\bdue to the fact that\b'
  suggestion: 'because'
- id: serves-as
  category: phrasal
  pattern: '\bserves as\b'
  suggestion: null
- id: unfilled-placeholder
  category: phrasal
  pattern: '\[(?:your (?:name|email|company|title)|insert (?:source|name|date|link|citation)|tbd)\]|\b\d{4}-XX-XX\b'
  suggestion: null
- id: chatbot-citation-markup
  category: phrasal
  pattern: '(?:\bciteturn\d+(?:search|view|fetch)\d+\b|\boai_citation\b|\bcontentReference\[oaicite:\d+\])'
  suggestion: null
- id: ai-tool-url-parameter
  category: phrasal
  pattern: '\butm_source=(?:chatgpt\.com|copilot\.com)\b'
  suggestion: null
